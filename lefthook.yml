# lefthook — enforces DESIGN_SYSTEM.md and the repo rules on every commit.
#
# Neither lint is skippable with --no-verify on this repo's CI. Every rule they
# enforce was broken at least once; see DESIGN_SYSTEM.md for the visual failures and
# docs/WORKFLOW.md for the repo ones.
#
# Two lints, deliberately separate scripts: design-system is a LINE scanner over
# source (it works fine scoped to {staged_files}), repo-hygiene asks what git
# tracks (a whole-repo question that cannot be scoped to one file).

pre-commit:
  parallel: false
  commands:
    design-system:
      glob: "*.{mjs,html,css}"
      run: node scripts/lint-design.mjs {staged_files}

    repo-hygiene:
      # Catches tracked review frames, review/render directories committed into the
      # tree, loose unorganised files at the root, and committed secrets.
      run: node scripts/lint-repo.mjs

    springs:
      # The motion maths: closed-form springs (overshoot, the peak the pointer waits for, one spring per change,
      # the camera zoom) and the pointer model. Pure functions of time, checked offline.
      glob: "{src/lkspring.mjs,src/lkpointer.mjs,src/lkdirector.mjs,scripts/test-spring.mjs,scripts/test-pointer.mjs,docs/ANIMATION.md}"
      run: node scripts/test-spring.mjs && node scripts/test-pointer.mjs

    camera:
      glob: "{src/camera/**,scripts/test-camera.mjs}"
      run: node scripts/test-camera.mjs

    docs:
      # docs/{domain}/{primitive}.md mirrors the source (docs/naming-conventions.md)
      glob: "{docs/**,src/camera/**,src/components/**,src/transitions/**,scripts/lint-docs.mjs}"
      run: node scripts/lint-docs.mjs

    colour:
      # The OKLCH lip: derived from each element's own colour at render time (lightness down, hue and chroma kept).
      glob: "{src/lkcolor.mjs,src/lkextrude.mjs,scripts/test-color.mjs}"
      run: node scripts/test-color.mjs

    components:
      # Renders every registered component with its own sample and checks the anatomy (card, tile,
      # icon, text; scale only; solid; extruded; pointer targets resolve; one source of truth).
      glob: "{src/**,scripts/lint-components.mjs,docs/COMPONENTS.md}"
      run: node scripts/lint-components.mjs

    transitions:
      # Regenerates the sample of EVERY registered transition and checks it against the method in
      # docs/TRANSITION_FX.md (mask not overlay, one adjustment layer, pointer on top, no fades,
      # extruded 3D items, 3 x 2 px rings, deterministic). stage_fixed so a stale sample cannot ship.
      glob: "{src/**,scripts/lint-transitions.mjs,docs/TRANSITION_FX.md}"
      run: node scripts/lint-transitions.mjs
      stage_fixed: true

    build:
      # Regenerate the compositions and stage them, so a stale build can never
      # ship. `compositions/` is committed on purpose — Studio and the renderer
      # read it directly and a fresh clone must render without a build step.
      run: node src/build-beats.mjs && node scripts/entry.mjs
      stage_fixed: true

    verify-build:
      # After `build` + stage_fixed, the WORKING TREE must match the INDEX.
      # Only the working tree — checking --cached as well can never pass during a
      # commit, because the staged content IS the commit being made. A rule that
      # can only ever fail trains people to reach for --no-verify.
      run: git diff --quiet
      stage_fixed: false

pre-push:
  # Everything, not a subset: the whole of `npm run lint` (design system, pacing, pointer model,
  # transition/fx maths, transition samples, repo hygiene). Nothing the docs describe can be pushed
  # unless the code and the samples still obey it.
  commands:
    all-lints:
      run: npm run lint