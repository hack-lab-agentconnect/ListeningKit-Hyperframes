<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
/* ---- fonts: Satoshi only. tailwind.config.js aliases mono to sans on purpose. */
@font-face{font-family:'Satoshi';src:url('assets/fonts/Satoshi-Light.woff') format('woff');font-weight:300;font-display:block}
@font-face{font-family:'Satoshi';src:url('assets/fonts/Satoshi-Regular.woff') format('woff');font-weight:400;font-display:block}
@font-face{font-family:'Satoshi';src:url('assets/fonts/Satoshi-Medium.woff') format('woff');font-weight:500;font-display:block}
@font-face{font-family:'Satoshi';src:url('assets/fonts/Satoshi-Bold.woff') format('woff');font-weight:700;font-display:block}
@font-face{font-family:'Satoshi';src:url('assets/fonts/Satoshi-Black.woff') format('woff');font-weight:900;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;
 font-family:'Satoshi',system-ui,sans-serif;font-synthesis:none;
 -webkit-font-smoothing:antialiased}
.clip{position:absolute;inset:0}
.ringdefs{position:absolute;top:0;left:0;pointer-events:none}

/* ---- stage. Flat colour, never a gradient: the app's shell is a flat
   backgroundColor with a dither layer on top (OnboardingShell.tsx:65,70).
   One .stage div per beat, so the background itself cuts between beats. */
.stages{position:absolute;inset:0;z-index:0}
.stage{position:absolute;inset:0;background:#2A8CFF}
.stage.white{background:#FFFFFF}

/* ---- dither. The app's is a WebGL simplex fBm field put through an 8x8 Bayer
   ordered dither at colorNum 4, pixelSize 3 (DitherCanvas.tsx:101-126), masked
   to the left and right edges at opacity-55 (OnboardingShell.tsx:15,70).
   Recreating that per-pixel in canvas JS produced a heavy overlay that both
   looked wrong and counted against the capture layer's overlay budget, so the
   visible surface here is the ordered-dither lattice itself: two 3px-period
   repeating gradients crossed at 45 degrees, which is what 8x8 Bayer looks like
   once quantised, plus the app's edge mask. It animates by sliding the lattice,
   so the frame is never static. */
#dither{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.5;
 background-image:
  repeating-linear-gradient(45deg, rgba(255,255,255,.85) 0 1.5px, rgba(255,255,255,0) 1.5px 3px),
  repeating-linear-gradient(-45deg, rgba(255,255,255,.85) 0 1.5px, rgba(255,255,255,0) 1.5px 3px);
 background-size:6px 6px,6px 6px;
 mask-image:linear-gradient(to right, black 0%, transparent 20%, transparent 80%, black 100%);-webkit-mask-image:linear-gradient(to right, black 0%, transparent 20%, transparent 80%, black 100%)}
/* On a white stage the lattice is BLUE, but it keeps the app's edge mask.
   Removing the mask here (as an earlier pass did) laid a full-frame blue wash
   over every white beat: the stage stopped reading as white and white type on
   it dropped to roughly 1.3:1. The app masks its dither to the edges on BOTH
   backgrounds (OnboardingShell.tsx:15) - that is the behaviour to copy. */
#dither.on-white{opacity:.55;
 background-image:
  repeating-linear-gradient(45deg, rgba(42,140,255,.30) 0 1.5px, rgba(42,140,255,0) 1.5px 3px),
  repeating-linear-gradient(-45deg, rgba(42,140,255,.30) 0 1.5px, rgba(42,140,255,0) 1.5px 3px)}

/* ---- the one persistent element is a moving chapter rail, not a stuck
   eyebrow. It wipes, it moves, it changes - see .rail in build-beats. */
.chapter{position:absolute;left:0;right:0;bottom:0;height:6px;z-index:70;
 display:flex;gap:4px;padding:0 88px 0}
.chapter i{flex:1;height:6px;background:rgba(255,255,255,.22);overflow:hidden;position:relative}
.stage.white .chapter i{background:rgba(42,140,255,.16)}
.chapter i b{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);
 background:#FFFFFF;display:block}
.stage.white .chapter i b{background:#2A8CFF}

/* ---- logo lockup: the onboarding hero treatment (OnboardingShell.tsx:43-45) */
.lockup{position:absolute;z-index:70;display:flex;align-items:center;gap:18px}
.lockup img{width:64px;height:64px;border-radius:18px;display:block}
.lockup .word{font-size:30px;font-weight:900;letter-spacing:0;text-transform:uppercase}
.lockup .obj{font-size:30px;font-weight:500;opacity:.72}
/* The logo is a blue tile with a white mark, so it needs NO filter on either
   stage — brightness(0) invert(1) (which used to be here) flattens both the
   background and the mark to solid white. */
.lockup.on-white img{filter:none}

/* ---- endcard lockup. The logo IS a blue tile with a white mark
   (apps/web/public/logo.svg), so on the blue stage it needs no backing plate -
   only a hard offset shadow to lift it off the field. Two earlier attempts were
   wrong: brightness(0) invert(1) flattened BOTH the blue background and the
   white mark to solid white (the end card shipped a blank white square), and a
   white plate behind an opaque blue logo is simply invisible. Tracking is 0: a
   tracked wordmark is not the wordmark. */
.ecmark{position:relative;width:168px;height:168px}
.ecmark img{position:absolute;inset:0;width:168px;height:168px;border-radius:18px;
  display:block;box-shadow:0 10px 0 0 rgba(9,32,63,0.30)}
.wordmark{font:900 84px/1.05 'Satoshi', system-ui, sans-serif;letter-spacing:0;text-transform:uppercase;color:#FFFFFF;white-space:nowrap}

/* ---- type scale */
.hero{font:900 104px/1.02 'Satoshi', system-ui, sans-serif;letter-spacing:-.03em}
.h1{font:900 84px/1.05 'Satoshi', system-ui, sans-serif;letter-spacing:-.025em}
.h2{font:900 62px/1.08 'Satoshi', system-ui, sans-serif;letter-spacing:-.02em}
.h3{font:500 38px/1.18 'Satoshi', system-ui, sans-serif;letter-spacing:-.015em}
.body{font:400 30px/1.45 'Satoshi', system-ui, sans-serif}
.eyebrow{font:700 20px/1 'Satoshi', system-ui, sans-serif;letter-spacing:.2em;text-transform:uppercase}
.label{font:700 17px/1.2 'Satoshi', system-ui, sans-serif;letter-spacing:.14em;text-transform:uppercase}
.kv{font:500 21px/1.3 'Satoshi', system-ui, sans-serif;letter-spacing:.04em}
.cap{font:400 34px/1.34 'Satoshi', system-ui, sans-serif}
.blue{color:#2A8CFF}
.white{color:#FFFFFF}
.dim{opacity:.72}
.dim2{opacity:.55}

/* ---- glass card on blue: border-white/30 bg-white/10 (OnboardingSteps.tsx:322) */
.glass{background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.30);
 box-shadow:0 6px 0 0 rgba(9,32,63,0.30)}
.glass:hover{background:rgba(255,255,255,.20)}
/* inverted: the selected state, border-white bg-white text-[#2a8cff] (:321) */
.invert{background:#FFFFFF;color:#2A8CFF}
/* white surface on blue: rounded-[32px] bg-white text-slate-900 (:475) */
.surface{background:#FFFFFF;color:#0F172A;
 box-shadow:0 10px 0 0 rgba(13,42,76,0.22),0 26px 60px -28px rgba(15,30,51,.45)}
.hard{box-shadow:inset 0 1px 0 0 #1f6fe6, inset 0 -2px 0 0 #117eff, 0 0 3px 0 rgba(0,0,0,0.2)}

/* ---- captions: the onboarding dashed underline is the signature link style
   (OnboardingSteps.tsx:369). Captions use it as their rail. */
.cap{z-index:80;display:flex;justify-content:center;align-items:flex-end;padding:0 260px 74px;pointer-events:none}
.cap span{display:inline-block;max-width:1440px;text-align:center;font:400 34px/1.34 'Satoshi', system-ui, sans-serif;
 font-weight:400;color:#FFFFFF;padding:14px 30px;border-radius:12px;
 background:rgba(10,24,48,.42);border:1.5px solid rgba(255,255,255,.16)}
#root.tone-white .cap span{color:#0F172A;background:rgba(255,255,255,.88);border-color:#E2E8F0}

/* ---- shared diagram primitives */
.connector{fill:none;stroke:#FFFFFF;stroke-width:3;stroke-linecap:round}
.connector.blue{stroke:#2A8CFF}
.node{padding:22px 26px}
.node .nk{font:700 17px/1.2 'Satoshi', system-ui, sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
.node .nv{font:500 38px/1.18 'Satoshi', system-ui, sans-serif;font-weight:900;margin-top:6px}

/* ---- icon primitive. Heroicons 24 outline, stroke currentColor, sw 1.5 -
   the app's own icon defaults (lkicons.mjs). Sits at the LEFT of a card.
   Radius is rounded-sm (8), NOT a large radius: the app has no fully-rounded
   tile in this position, and at 72px a 12px radius already reads as a lozenge.
   Two tile treatments, and the difference matters:
     .ico.on-blue  brand-blue tile, WHITE glyph  - on a white card
     .ico.on-white light tint tile, BLUE glyph    - on a blue stage
   A bare icon with no tile is fine either way. */
.ic{display:block;flex:none;overflow:visible}
.ico{display:flex;flex:none;align-items:center;justify-content:center;
 width:72px;height:72px;border-radius:8px;
 background:#2A8CFF;color:#FFFFFF;box-shadow:0 0 0 3px #0A0F1A}
.ico.on-white{background:#EFF6FF;color:#2A8CFF}
/* Icon tile sitting on a BRAND BLUE card: the tile inverts to solid white with
   a blue glyph. A blue tile on a blue card is the icon disappearing, which is
   the exact failure the white-stage cards had. */
.ico.on-bluecard{background:#FFFFFF;color:#2A8CFF}
.ico.plain{background:none;width:auto;height:auto;color:inherit;box-shadow:none}
/* Compact tile for a chip / inline row, where the 72px panel tile would make the
   label wrap. Same colour rule as .ico - solid brand blue with a white glyph on
   a white card, inverted to solid white with a blue glyph on a blue card. */
.ico.xs{width:44px;height:44px;border-radius:8px}
.irow{display:flex;align-items:center;gap:24px}
.irow > .itx{flex:1;min-width:0}

/* ---- grid + list rows used by the field-by-field beats */
.rows{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:22px;padding:18px 24px;border-radius:14px}
.row .rk{font:500 21px/1.3 'Satoshi', system-ui, sans-serif;width:270px;flex-shrink:0;opacity:.8}
.row .rv{font:500 38px/1.18 'Satoshi', system-ui, sans-serif;font-weight:500}
.row .rdot{margin-left:auto;width:12px;height:12px;border-radius:50%;background:currentColor;opacity:.28}

/* ---- countup, the one pure-number beat */
.count{display:flex;align-items:baseline;justify-content:center;gap:16px}
.count .n{font-size:300px;font-weight:900;line-height:.9;letter-spacing:-.045em;
 font-variant-numeric:tabular-nums}
.count .u{font-size:84px;font-weight:500;opacity:.72}

/* ---- bar chart (sentiment) */
.bar{display:flex;align-items:center;gap:20px;padding:14px 0}
.bar .bl{font:500 21px/1.3 'Satoshi', system-ui, sans-serif;width:130px;opacity:.8}
.bar .bt{flex:1;height:26px;border-radius:8px;overflow:hidden;background:rgba(127,127,127,.14)}
.bar .bf{display:block;height:100%;width:0;border-radius:8px}
.bar .bv{font:500 21px/1.3 'Satoshi', system-ui, sans-serif;width:150px;text-align:right;opacity:.8}

/* ---- journey / step cards */
.jr{display:flex;gap:20px;justify-content:center}
.jr .card{width:400px;padding:30px 28px;border-radius:20px}
.jr .num{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;
 justify-content:center;font-size:20px;font-weight:700}
.jr .ch{font:500 38px/1.18 'Satoshi', system-ui, sans-serif;font-weight:900;margin-top:20px}
.jr .cs{font:400 30px/1.45 'Satoshi', system-ui, sans-serif;font-weight:400;opacity:.72;margin-top:10px}
.jr .cm{font:500 21px/1.3 'Satoshi', system-ui, sans-serif;margin-top:18px;opacity:.6}

/* ---- transcript surface */
.tw{border-radius:24px;overflow:hidden}
.thead{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;
 border-bottom:1.5px solid rgba(127,127,127,.14)}
.tscroll{height:400px;overflow:hidden;padding:24px 32px;position:relative}
.tline{font:400 30px/1.55 'Satoshi',sans-serif;margin-bottom:18px;opacity:.9}
.tline.hit{font-weight:900}
.wave{display:flex;align-items:flex-end;gap:4px;height:92px;padding:18px 28px}
.wave i{flex:1;height:var(--h);border-radius:3px;transform-origin:bottom}

/* ---- data table: moved to src/components/table (its css lives with the component) */

/* ---- working / progress theater */
.wrow{display:flex;align-items:center;gap:20px;padding:18px 24px;border-radius:14px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(127,127,127,.2);
 border-top-color:currentColor}
.wrow[data-state=done] .spin{display:none}
.chk{width:30px;height:30px;margin-left:auto}
.chk path{stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---- chips that converge (constellation). R.lg, NOT R.pill: these are cards
   carrying an object name, not status badges, and a 999px radius turned them
   into lozenges. Fully-rounded is for real pills only (DESIGN_SYSTEM 2.3). */
.chip{padding:13px 22px;border-radius:14px;font-size:23px;font-weight:600;
 white-space:nowrap}

/* ---- cursor. The real product cursors, lifted from
   nebius-hackathon/apps/web/public/cursors/ - not a hand-drawn triangle.
   pointer.svg is the dark arrow with a light outline, so it survives on both
   the blue and the white stage without a second asset. Sized large on purpose:
   at 34px it read as a speck on a 1920 frame. */
/* The cursor art is cropped to the arrow itself (viewBox 0 0 34 38) and drawn at
   exactly 2x: 68x76 px, arrow tip at (10,10) inside the box. It used to be an
   80x64 canvas with a 30px arrow in one corner, drawn at 168px - so the "large
   cursor" was a 63px arrow floating in 100px of nothing, and its tip sat ~10px
   off wherever it was aimed. Size and hotspot now mean what they say, and the
   director (lkdirector.mjs) aims the TIP at a measured element.
   left/top are pinned to 0 so a GSAP x/y is a stage coordinate, not an offset
   from wherever a flex container decided an inset-less box should sit. */
.cursor{position:absolute;left:0;top:0;width:0;height:0;z-index:75;pointer-events:none}
/* Three states stacked on one anchor, each offset so ITS hotspot sits on the anchor:
     .cs-n  the arrow           viewBox 0 0 34 38   at 2.4x -> tip at (12,12)
     .cs-h  the open hand       viewBox -6 -6 89 75 at 2x   -> middle fingertip (40,4)
     .cs-c  the pointing hand   viewBox -6 -6 89 75 at 2x   -> fingertip (30,4)
   The director switches them (arrow -> hand on hover -> pointing hand on the press ->
   arrow). Only the active one has opacity 1. The cursor is the subject of every scene,
   so it is drawn large: ~90px of arrow on a 1920 frame. */
.cursor .cs{position:absolute;display:block;opacity:0;background-repeat:no-repeat;background-size:100% 100%} /* swap-ok: sprite swap */
.cursor .cs-n{left:-12px;top:-12px;width:82px;height:91px;opacity:1;background-image:url('assets/cursors/pointer.svg')} /* swap-ok */
.cursor .cs-h{left:-40px;top:-4px;width:178px;height:150px;background-image:url('assets/cursors/hover.svg')}
.cursor .cs-c{left:-30px;top:-4px;width:178px;height:150px;background-image:url('assets/cursors/click.svg')}
/* The click ripple. A ring, because it is a transient effect, never a surface. */
.ripple{position:absolute;left:0;top:0;z-index:74;width:80px;height:80px;border-radius:50%;
 pointer-events:none;border:4px solid #7FBAFF}
.ripple.on-blue{border-color:#FFFFFF}

/* ---- how a Twenty object is NAMED on screen.
   The camelCase API name was being set in the same weight and size as the
   human title beside it, in a different case pattern, at low opacity. Three
   competing shapes of type for one idea. The rule now: the human title is the
   display element, and the API name is a small uppercase monospace-ish tag in
   a translucent chip - present for accuracy, visually subordinate. */
.apichip{display:inline-block;font:500 19px/1 'Satoshi',system-ui,sans-serif;
 letter-spacing:.02em;padding:9px 14px;border-radius:8px;
 background:rgba(42,140,255,.10);border:1.5px solid rgba(42,140,255,.22);
 color:#2A8CFF;white-space:nowrap;vertical-align:middle}
.on-blue .apichip,.apichip.on-blue{background:rgba(255,255,255,.14);
 border-color:rgba(255,255,255,.30);color:#FFFFFF}

/* ---- stage centre: every beat composes around the middle of the frame, never
   a fixed top-left corner. */
.stagec{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:34px;padding:110px 120px 150px;z-index:20;text-align:center}
.stagec .row{text-align:left}
.stagec .bar{text-align:left}

/* ---- extrusion (lkextrude.mjs): a host that is a slab, and its slices */
/* A slab is OWNED by its host: the host is the slices' containing block (position:relative), so the extrusion
   moves, scales and rotates with the element and can never be positioned off some other layer. Without this the
   absolutely-positioned slices attach to the nearest positioned ancestor the moment the host's own transform
   clears at rest: the "extruded off the layer the div is on" bug. */
.x3d{transform-style:preserve-3d;position:relative}
/* the chain of preserve-3d: a slab sitting under a flat wrapper is flattened into the plane, so everything inside
   the stage keeps the 3D context (overflow:hidden leaves flatten themselves, which is fine: they have no slab) */
.stagec,.stagec *:not(svg):not(svg *){transform-style:preserve-3d}
.xl{position:absolute;pointer-events:none;border-radius:inherit;background:currentColor} /* the runtime replaces it with the derived lip */


.pillc{display:flex;align-items:center;gap:20px;padding:0 28px 0 12px;font:900 34px/1 'Satoshi',sans-serif;white-space:nowrap}
.pillc .ico{width:64px;height:64px}


/* ---- components/table: header band, column heads, rows that each rise on their own.
   Plain grid, no <table>: every cell animates. */
.tcols,.trow{display:grid;align-items:center;gap:18px;padding:14px 30px}
.tcols{padding-top:18px;padding-bottom:6px}
.tch{display:flex;align-items:center;gap:12px;font:700 17px/1.2 'Satoshi', system-ui, sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.82}
.tbody{display:flex;flex-direction:column;gap:10px;padding:6px 18px 26px}
.trow{border-radius:14px;font:400 30px/1.45 'Satoshi', system-ui, sans-serif;font-weight:500;text-align:left}
.trow .tc:first-child{font-weight:900}
.tc{white-space:nowrap;overflow:hidden;text-overflow:clip}


/* ---- the depth set. .stagec is a 3D rendering context: satellites sit at their own
   depth, the director's camera moves through them. Components, not text blocks. */
.stagec{transform-style:preserve-3d}
.satset{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d;z-index:1}
.sat{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:16px;
 padding:14px 32px 14px 14px;white-space:nowrap;font-weight:700;line-height:1.1}
.satl{font-weight:700}
.sat .ico.sat-fg{width:68px;height:68px}
.sat .ico.sat-bg{width:54px;height:54px}


/* ---- the cutout satellite: a die-cut sticker. The black outer stroke is four hard drop-shadows (zero blur). */
.sat.cut{display:block;padding:0;gap:0;font-size:0;transform-style:preserve-3d}
.cut img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;display:block}
.cut .cutf{filter:drop-shadow(3px 0 0 #0A0F1A) drop-shadow(-3px 0 0 #0A0F1A) drop-shadow(0 3px 0 #0A0F1A) drop-shadow(0 -3px 0 #0A0F1A)}
.cut .cutsl{filter:brightness(0.45);background:none} /* an image has no background to derive from: its own pixels, darker */


/* overwhelm. The centring lives on the wrapper, never on the animated box ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€šÃ‚Â
   GSAP writes the whole transform, so a translate(-50%,-50%) on the animated
   element would be overwritten the moment it scales. */
.ovwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3}
.ovbox{z-index:3}
/* .ovorb is the orbiting anchor (GSAP positions it on an ellipse); .ovcard sits
   centred on it and is what flies in. Two elements so the orbit and the entrance
   never write the same transform. */
.ovorb{position:absolute;left:50%;top:50%;width:0;height:0;z-index:2}
.ovcard{position:absolute;left:0;top:0;text-align:left}
.ovt{font-size:36px;font-weight:700;line-height:1.15;white-space:nowrap}

/* zoom-out reveal */
.zw{display:flex;flex-direction:column;align-items:center;gap:40px}
.myst{display:flex;align-items:center;justify-content:center}
/* The number's own line box is taller than its glyphs, so the eyebrow sitting
   directly above it sat INSIDE that box on the counted beats. Breathing room
   here is what keeps the kicker legible rather than relying on the gap alone. */
.count{margin-top:64px;margin-bottom:48px}

/* record panel + note callout */
.pan{z-index:2}
/* The panel and the note are laid out as a ROW, not as absolutely positioned
   boxes. Positioned independently they were both centred/righted against the
   frame and overlapped by ~310px on every record beat in the film, which the
   layout check reported 12 times and which reads on screen as the note sitting
   on top of the record. In a row they cannot collide at any width. */
.recrow{display:flex;gap:44px;align-items:center;justify-content:center;width:100%;z-index:2}
.note{position:absolute;right:120px;top:50%;transform:translateY(-50%);z-index:4;text-align:left;width:560px}
.note.inrow{position:static;transform:none;width:auto;flex:0 0 600px;align-self:center}
.relsvg{z-index:1}

/* agent work */
.wk{z-index:2}

/* sentiment */
.sb{z-index:2;width:1120px}
.sb .note{right:auto;left:120px;top:auto;bottom:120px;transform:none;width:700px}

/* converge */
.cvf{display:flex;align-items:center;justify-content:center}
.cvchip{z-index:1}

/* journey cards */
.jcard{z-index:2;text-align:left}

/* typewriter */
.twl-line{display:flex;align-items:center;justify-content:center;min-height:64px}
.caret{margin-left:6px}

/* split */
.sp{z-index:2;text-align:left}
.spdiv{align-self:center;height:300px}

/* the wipe sheet a section transition crosses the frame on. It sits above the
   stage and below nothing, so the beat it covers is fully hidden by it. */
.flash{position:absolute;inset:0;z-index:85;opacity:0;pointer-events:none;
 background:radial-gradient(circle at 50% 50%,#FFFFFF 0,#FFFFFF 38%,#7FBAFF 100%)}
  // composition_heavy_overlay_count_high) ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€šÃ‚Â which is exactly why

.fx .w,.fx .c{display:inline-block;will-change:transform,opacity}
.fxmark{background-image:linear-gradient(#7FBAFF,#7FBAFF);background-repeat:no-repeat;

  chars: (el) => {

const __dir = {
  W: 1920, H: 1080,

  /** Centre of el in 1920x1080 stage space, with the timeline parked at `at`. */
  centre(tl, root, el, at) {
    if (!el) return null;
    const keep = tl.time();
    tl.seek(at, false);
    const rr = root.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    tl.seek(keep, false);
    if (!rr.width || !r.width) return null;
    const k = rr.width / 1920;
    return { x: (r.left + r.width / 2 - rr.left) / k, y: (r.top + r.height / 2 - rr.top) / k,
             w: r.width / k, h: r.height / k, left: (r.left - rr.left) / k, top: (r.top - rr.top) / k };
  },

  all(root, sel) { try { return Array.from(root.querySelectorAll(sel)); } catch (e) { return []; } },

  /**
   * RETIME. Shift every tween that targets item i (or anything inside it) so the
   * item's first tween starts at slots[i]. Never earlier than it already was: a
   * retime only ever delays, so an entrance cannot jump ahead of the beat's own
   * kicker. The tail group is pinned to land just after the last item.
   */
  retime(tl, root, spec) {
    const items = spec.items.map((sel) => __dir.all(root, sel));
    const tails = (spec.tail || []).map((sel) => __dir.all(root, sel));
    const tweens = tl.getChildren(true, true, false);
    const firstStart = (els) => {
      let min = Infinity;
      tweens.forEach((tw) => {
        const tg = (tw.targets && tw.targets()) || [];
        if (tg.some((t) => t && t.nodeType === 1 && els.some((e) => e === t || e.contains(t)))) min = Math.min(min, tw.startTime());
      });
      return min;
    };
    const shift = (els, delta) => {
      if (!(delta > 0.01)) return;
      tweens.forEach((tw) => {
        const tg = (tw.targets && tw.targets()) || [];
        if (tg.some((t) => t && t.nodeType === 1 && els.some((e) => e === t || e.contains(t)))) tw.startTime(tw.startTime() + delta);
      });
    };
    let lastEnd = 0;
    items.forEach((els, i) => {
      if (!els.length) return;
      const from = firstStart(els);
      if (!isFinite(from)) return;
      const want = Math.max(from, spec.slots[i] - spec.lead);
      shift(els, want - from);
      lastEnd = Math.max(lastEnd, want + 0.9);
    });
    tails.forEach((els) => {
      if (!els.length) return;
      const from = firstStart(els);
      if (isFinite(from)) shift(els, Math.max(0, lastEnd + 0.15 - from));
    });

  /** A cubic bezier as a GSAP ease. y2 > 1 overshoots: the "bezier overshoot zoom". */
  bez(x1, y1, x2, y2) {
    const cv = (t, a, b) => ((1 - 3 * b + 3 * a) * t + (3 * b - 6 * a)) * t * t + 3 * a * t;
    const sl = (t, a, b) => 3 * (1 - 3 * b + 3 * a) * t * t + 2 * (3 * b - 6 * a) * t + 3 * a;
    return (p) => {
      if (p <= 0) return 0;
      if (p >= 1) return 1;
      let t = p;
      for (let i = 0; i < 8; i++) {
        const e = cv(t, x1, x2) - p, d = sl(t, x1, x2);
        if (Math.abs(e) < 1e-6) break;
        if (Math.abs(d) < 1e-6) break;

      }
      return cv(t, y1, y2);
    };
  },

  /**
   * The camera pose that puts world point P at the centre of the frame, at zoom s,
   * with a yaw/pitch tilt. The stage wrapper is rotated about the frame centre and
   * then translated, so the translation has to cancel the ROTATED position of P -
   * otherwise a tilted camera slides off its target. Zoom is a move along z under a
   * fixed perspective (scale at depth = D / (D - z)), so tilt and zoom are one move.
   */
  pose(P, s, rx, ry) {
    const D = 1600, r = Math.PI / 180;
    const cx = Math.cos(rx * r), sx = Math.sin(rx * r), cy = Math.cos(ry * r), sy = Math.sin(ry * r);
    const y1 = P[1] * cx - P[2] * sx, z1 = P[1] * sx + P[2] * cx;     // rotateX
    const x2 = P[0] * cy + z1 * sy, z2 = -P[0] * sy + z1 * cy;         // then rotateY

  /**
   * CAMERA. One 3D transform on the stage wrapper (perspective, translate, tilt).
   * A shot flies the frame onto a target - a chunk of captions, an item of the
   * scene, or a wide that re-establishes both - on a bezier that overshoots and
   * settles, then keeps creeping for as long as it is held. `cs` are the item
   * centres, measured BEFORE any camera tween exists.
   */

    // the subtitle pill that sits flat across the bottom (it is in the root, outside this world).
    const LOW = 120;
    tl.set(stage, { transformPerspective: D, transformOrigin: "50% 50%" }, 0);
    // The entrance: the frame starts pushed toward the camera and a few degrees off axis.
    tl.fromTo(stage, { z: 220, rotationY: -spec.dir * 6, rotationX: 2, x: 0, y: 0 },
      { z: 0, rotationY: 0, rotationX: 0, duration: 1.2, ease: EASE }, spec.enter);
    spec.shots.forEach((sh, i) => {
      const at = spec.enter + sh.at;
      let P = [0, 0, 0], s = sh.zoom || 1;

        // push IN on the thing the cursor is about to press (a satellite has a known
        // world position; a scene item was measured)

          // surrounds (aim between the two, zoom less), never centre on it alone - that threw
          // the scene to the bottom edge and under the subtitles.
          P = [st.world.x * 0.42, st.world.y * 0.42 + LOW, st.world.z * 0.4];
          s = Math.min(sh.zoom, 1.25);
        }
        else if (cs[sh.stop]) {
          const c = cs[sh.stop];
          P = [c.x - __dir.W / 2, c.y - __dir.H / 2 + LOW, 0];
          // CLOSE: fill the frame with the element, by whichever of its sides asks for more (a wide thin row fills by
          // its height and is framed on the hand, cropped at the sides, instead of staying wide), never past sh.zoom

        }

      }

      tl.to(stage, { x: to.x, y: to.y, z: to.z, rotationX: to.rotationX, rotationY: to.rotationY,
        duration: 0.8, ease: sh.mode === "wide" ? EASE_WIDE : EASE }, at);

      tl.to(stage, { z: to.z + 45, rotationY: to.rotationY * 0.55, duration: Math.max(0.4, nextAt - at - 0.8), ease: "none" }, at + 0.8);
    });

    tl.to(stage, { x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, duration: 0.5, ease: "power2.inOut" }, spec.end);
  },

  /**
   * SATELLITES. The depth set rises into the world: each component starts below and
   * far behind its place and travels up the Y axis and forward along Z toward the
   * camera, overshooting and settling, staggered rather than one after another. Once
   * seated it keeps a slow bob, so the layers never freeze.

    const EASE = __dir.bez(0.2, 1, 0.3, 1.14);
    spec.items.forEach((sp, i) => {
      const el = root.querySelector('.sat[data-i="' + i + '"]');
      if (!el) return;
      const at = spec.enter + 0.12 + i * 0.17;
      tl.set(el, { xPercent: -50, yPercent: -50 }, 0);
      tl.fromTo(el, { x: sp.x, y: sp.y + 340, z: sp.z - 720, rotationX: -32, scale: 0 },

    });
  },

  /**

   * back when the narration moves on - the depth-of-field cue, with no blur.
   * `list` is [{ sel, at, back }]: raise at `at`, return at `back` (or stay up).
   */
  lift(tl, root, list) {
    list.forEach((l) => {
      __dir.all(root, l.sel).forEach((el) => {
        tl.to(el, { z: l.z || 90, duration: 0.5, ease: __spr.snap }, l.at);
        if (l.back) tl.to(el, { z: 0, duration: 0.45, ease: "power2.inOut" }, l.back);
      });
    });
  },

  /**

   * 3D world, is on screen in every scene, and is the thing the viewer follows.
   *
   * Its life is a loop of three moves, repeated for each stop:
   *   APPROACH  leave the resting quadrant on a curved bezier, with mass: it starts
   *             slowly, overshoots its mark and settles. As it nears the target it
   *             also comes TOWARD THE CAMERA along z, so the click is the closest
   *             thing in the frame.
   *   CLICK     the arrow turns to an open hand on arrival (hover), a pointing hand on
   *             the press (click), then back to the arrow. The press ripples.
   *   RETREAT   pull away along z and back out to the opposite quadrant while the
   *             camera pulls out with it, and sway there until the next stop.
   *

    const nS = cur.querySelector(".cs-n"), hS = cur.querySelector(".cs-h"), cS = cur.querySelector(".cs-c");
